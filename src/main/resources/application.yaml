spring:
  application:
    name: homerunhome
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/homerunhome?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
tago:
  base-url: ${TAGO_BASE_URL:https://apis.data.go.kr/1613000/TrainInfo}
  service-key: ${TAGO_SERVICE_KEY:}
tour-api:
  base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011}
  service-key: ${TOUR_API_SERVICE_KEY:}
  mobile-app: ${TOUR_API_MOBILE_APP:HomerunHome}
  connect-timeout: ${TOUR_API_CONNECT_TIMEOUT:2s}
  read-timeout: ${TOUR_API_READ_TIMEOUT:5s}
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  local-base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
  mobility-base-url: ${KAKAO_MOBILITY_BASE_URL:https://apis-navi.kakaomobility.com}
  connect-timeout: ${KAKAO_CONNECT_TIMEOUT:2s}
  read-timeout: ${KAKAO_READ_TIMEOUT:3s}
